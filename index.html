<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b24"><title>GoldenglobalXprex | Travel & Transport</title><style>
:root{--green:#176b4d;--deep:#102b24;--lime:#d9f36a;--bg:#f4f8f5;--line:#dfe8e2;--muted:#68776f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17231f;font:15px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;background:white;min-height:100vh;box-shadow:0 0 30px #102b2410}.top{background:var(--deep);color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--lime);color:var(--deep);width:45px;height:45px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:18px}.brand b{font-size:19px}.brand small{display:block;color:#c6d9ce}.tag{border:1px solid #527263;border-radius:99px;padding:7px 12px;font-size:12px;color:#e3eee7}.layout{display:grid;grid-template-columns:210px 1fr;min-height:78vh}aside{padding:24px 14px;border-right:1px solid var(--line);background:#fbfdfb}.nav{display:grid;gap:7px}.nav button{border:0;background:none;text-align:left;padding:12px;border-radius:10px;color:#52635b;font-weight:650}.nav button.active,.nav button:hover{background:#e8f4ed;color:var(--green)}main{padding:clamp(18px,4vw,42px);min-width:0}.eyebrow{color:var(--green);font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:clamp(29px,4vw,42px);line-height:1.1;letter-spacing:-1px;margin:8px 0}h2{font-size:21px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 24px}.hero{background:linear-gradient(125deg,#102b24,#1d704f);color:white;padding:30px;border-radius:23px;margin-bottom:25px}.hero h2{font-size:28px;max-width:540px}.hero p{color:#d5e7dc;max-width:540px}.btn{border:0;border-radius:11px;background:var(--green);color:white;font-weight:750;padding:12px 16px}.btn.lime{background:var(--lime);color:var(--deep)}.btn.light{background:#e8f4ed;color:var(--green)}.btn.ghost{background:white;color:#24352c;border:1px solid var(--line)}.btn.danger{background:#fff0ee;color:#b42318}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.service{display:flex;align-items:center;gap:12px;padding:17px;border:1px solid var(--line);border-radius:15px;background:white;text-align:left}.service:hover{border-color:#78aa8d}.ico{width:44px;height:44px;border-radius:13px;background:#e8f4ed;display:grid;place-items:center;font-size:22px;flex:none}.service small{display:block;color:var(--muted);margin-top:3px}.arr{margin-left:auto;font-size:22px;color:var(--muted)}.panel{border:1px solid var(--line);border-radius:17px;padding:19px;margin:18px 0;background:white}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#52635b}input,select,textarea{width:100%;border:1px solid #d5e0d9;border-radius:10px;padding:12px;background:white;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #b7d9c5;border-color:var(--green)}.option{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left;margin:9px 0}.option.selected{border:2px solid var(--green);background:#f1faf4}.price{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}.muted{color:var(--muted);font-size:13px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.notice{background:#fff6dc;color:#765a16;padding:13px;border-radius:11px;font-size:13px;margin:14px 0}.badge{display:inline-block;padding:4px 8px;border-radius:7px;background:#e8f4ed;color:var(--green);font-size:11px;font-weight:800}.badge.pending{background:#fff4d6;color:#865b00}.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .detail{flex:1;min-width:0}.row strong{display:block}.empty{text-align:center;padding:25px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:13px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.foot{text-align:center;border-top:1px solid var(--line);padding:18px;color:var(--muted);font-size:12px}.mobile{display:none}.hide{display:none!important}@media(max-width:720px){.layout{display:block}aside{display:none}main{padding:20px 15px 88px}.grid,.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px;z-index:3}.mobile button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}.mobile button.active{color:var(--green);font-weight:800}.mobile span{font-size:19px}.hero{padding:22px}.hero h2{font-size:24px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">GX</div><div><b>GoldenglobalXprex</b><small>Transport · Flights · Travel services</small></div></div><span class="tag">Website prototype · Demo mode</span></header><div class="layout"><aside><nav id="nav" class="nav"></nav><p class="muted" style="margin:26px 9px">Plan your journey, submit a request and keep track of bookings in one place.</p></aside><main id="main"></main></div><footer class="foot">GoldenglobalXprex · Prototype version. Live inventory, provider connections and payment processing are not yet connected.</footer><nav id="mobile" class="mobile"></nav></div><script>
const S={ride:{name:'City rides',icon:'🚘',desc:'Book a local trip',fee:.1,opts:[['GX Standard','Everyday city ride',3500],['GX Comfort','Extra comfort',5200],['GX XL','More passenger space',7400]]},driver:{name:'Hire a driver',icon:'🛞',desc:'Driver by the hour',fee:.15,opts:[['4-hour package','Within the city',15000],['8-hour package','Full-day errands',26000],['12-hour package','Long day / intercity by arrangement',35000]]},flight:{name:'Flights',icon:'✈️',desc:'Domestic and international flight assistance',fee:.03,opts:[['Economy assistance','Illustrative Lagos → Abuja estimate',86400],['Flexible assistance','Illustrative Lagos → Abuja estimate',91500],['Premium assistance','Confirm final fare with airline',125000]]},bus:{name:'Bus tickets',icon:'🚌',desc:'Intercity coach booking',fee:.07,opts:[['Executive coach','Illustrative Lagos → Abuja estimate',15400],['Standard coach','Illustrative Lagos → Abuja estimate',12900],['Budget coach','Illustrative Lagos → Abuja estimate',11500]]}};
let db;try{db=JSON.parse(localStorage.getItem('ggx_db'))||{bookings:[],profile:{name:'',phone:'',email:''}}}catch(e){db={bookings:[],profile:{name:'',phone:'',email:''}}}let page='home',svc='',choice=-1,pending=null,last=null,admin=false,query='';const money=n=>'₦'+Number(n||0).toLocaleString('en-NG'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('ggx_db',JSON.stringify(db))}function go(p){page=p;svc='';choice=-1;render()}function nav(){let a=[['home','⌂','Home'],['bookings','▤','Bookings'],['wallet','₦','Wallet'],['account','☺','Account']];if(admin)a.push(['admin','⚙','Admin']);let html=a.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}　${x[2]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobile').innerHTML=a.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function home(){return `<div class="eyebrow">Your journey starts here</div><h1>Move with confidence.</h1><p class="sub">Find a ride, arrange a driver or plan your next trip.</p><section class="hero"><span class="badge" style="background:var(--lime);color:var(--deep)">GOLDENGLOBALXPREX</span><h2>Where would you like to go?</h2><p>Transport and travel booking in one simple experience. Submit requests online and confirm details with our team.</p><button class="btn lime" onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'})">Explore services ↓</button></section><div class="between"><h2 id="services">Book a service</h2><span class="muted">Choose a category</span></div><div class="grid">${Object.entries(S).map(([k,s])=>`<button class="service" onclick="start('${k}')"><span class="ico">${s.icon}</span><span><b>${s.name}</b><small>${s.desc}</small></span><span class="arr">›</span></button>`).join('')}</div><section class="panel"><div class="between"><div><h2>Recent bookings</h2><p class="muted">Requests saved in this browser.</p></div><button class="btn light" onclick="go('bookings')">View all</button></div>${db.bookings.length?db.bookings.slice(0,3).map(row).join(''):'<div class="empty">No bookings yet. Choose a service to begin.</div>'}</section>`}
function start(k){svc=k;choice=-1;page='form';render()}function form(){let s=S[svc];return `<button class="btn ghost" onclick="go('home')">← Back</button><div class="eyebrow" style="margin-top:18px">New booking request</div><h1>${s.icon} ${s.name}</h1><p class="sub">${s.desc}</p><div class="notice">All listed prices are estimates for demonstration. No live provider availability or payment is connected yet.</div><section class="panel"><h2>Journey details</h2><div class="fields" style="margin-top:14px">${svc==='driver'?'<div class="field full"><label>Pickup / service area</label><input id="from" placeholder="e.g. Lekki Phase 1" required></div><div class="field"><label>Duration</label><select id="duration"><option>4 hours</option><option>8 hours</option><option>12 hours</option></select></div>':'<div class="field"><label>From / pickup</label><input id="from" placeholder="e.g. Lagos or Ikeja" required></div><div class="field"><label>To / destination</label><input id="to" placeholder="e.g. Abuja or Victoria Island" required></div>'}<div class="field"><label>Date</label><input id="date" type="date" min="${new Date().toISOString().slice(0,10)}" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Passengers</label><select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field full"><label>Notes (optional)</label><textarea id="notes" rows="2" placeholder="Extra details or requests"></textarea></div></div></section><h2>Choose an option</h2>${s.opts.map((o,i)=>`<button class="option ${choice===i?'selected':''}" onclick="pick(${i})"><span class="ico">${s.icon}</span><span><b>${o[0]}</b><span class="muted" style="display:block">${o[1]}</span></span><span class="price">${money(o[2])}<small class="muted" style="display:block;font-weight:400">estimated base</small></span></button>`).join('')}<button class="btn" style="width:100%;margin-top:12px" onclick="review()">Continue to review →</button>`}function pick(i){choice=i;render()}function review(){if(choice<0)return alert('Please choose an option.');let from=document.getElementById('from').value.trim(),to=document.getElementById('to')?.value.trim()||'';if(!from||(svc!=='driver'&&!to))return alert('Please fill in your journey details.');let o=S[svc].opts[choice],fee=Math.round(o[2]*S[svc].fee);pending={service:svc,option:o[0],description:o[1],base:o[2],fee,total:o[2]+fee,from,to,date:document.getElementById('date').value,passengers:document.getElementById('passengers').value,notes:document.getElementById('notes').value,duration:document.getElementById('duration')?.value||'',status:'Awaiting confirmation',id:'GGX-'+Date.now().toString().slice(-8)};page='review';render()}function reviewPage(){let b=pending;if(!b)return home();return `<button class="btn ghost" onclick="page='form';render()">← Edit details</button><div class="eyebrow" style="margin-top:18px">Review request</div><h1>Confirm the details</h1><div class="notice">No payment will be taken. Submitting saves a request for you to follow up with the GoldenglobalXprex team.</div><section class="panel"><div class="between"><h2>${S[b.service].icon} ${esc(b.option)}</h2><span class="badge pending">Needs confirmation</span></div><p class="muted">${esc(b.description)}</p><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="between"><span class="muted">Route / pickup</span><b>${esc(b.from)} ${b.to?'→ '+esc(b.to):''}</b></div><div class="between" style="margin-top:10px"><span class="muted">Date</span><b>${esc(b.date)}</b></div><div class="between" style="margin-top:10px"><span class="muted">Passengers</span><b>${esc(b.passengers)}</b></div>${b.duration?`<div class="between" style="margin-top:10px"><span class="muted">Duration</span><b>${esc(b.duration)}</b></div>`:''}${b.notes?`<p class="muted" style="margin-top:10px">Notes: ${esc(b.notes)}</p>`:''}<hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="between"><span>Estimated base</span><b>${money(b.base)}</b></div><div class="between" style="margin-top:8px"><span>Estimated service fee</span><b>${money(b.fee)}</b></div><div class="between" style="margin-top:14px"><b>Total estimate</b><strong style="font-size:25px">${money(b.total)}</strong></div></section><button class="btn" style="width:100%" onclick="submitBooking()">Submit booking request</button>`}function submitBooking(){if(!pending)return;db.bookings.unshift(pending);save();last=pending;pending=null;page='done';render()}function done(){return `<section class="panel" style="text-align:center;padding:30px"><div class="ico" style="margin:0 auto 15px;border-radius:50%;font-size:28px">✓</div><div class="eyebrow">Request saved</div><h1>Thank you!</h1><p class="sub">Your reference is <b>${esc(last?.id||'')}</b>.</p><div class="notice" style="text-align:left">This is a locally saved prototype request. It has not yet been sent to a live booking team or travel provider. Live automated confirmations require a backend and provider integrations.</div><button class="btn" onclick="go('bookings')">View bookings</button> <button class="btn light" onclick="go('home')">Back home</button></section>`}function row(b){return `<div class="row"><span class="ico">${S[b.service]?.icon||'🧾'}</span><div class="detail"><strong>${esc(b.option)}</strong><div class="muted">${esc(b.from||'')} ${b.to?'→ '+esc(b.to):''} · ${esc(b.date||'')}</div><div class="muted">${esc(b.id)}</div></div><div style="text-align:right"><b>${money(b.total)}</b><div><span class="badge ${b.status==='Cancelled'?'':'pending'}">${esc(b.status)}</span></div>${b.status!=='Cancelled'?`<button class="btn danger" style="padding:6px 8px;font-size:11px;margin-top:5px" onclick="cancel('${b.id}')">Cancel</button>`:''}</div></div>`}function cancel(id){let b=db.bookings.find(x=>x.id===id);if(b&&confirm('Cancel this local booking request?')){b.status='Cancelled';save();render()}}function bookings(){let arr=db.bookings.filter(b=>JSON.stringify(b).toLowerCase().includes(query.toLowerCase()));return `<div class="eyebrow">Travel history</div><h1>Your bookings</h1><p class="sub">Review requests saved on this device.</p><div class="between"><input style="max-width:340px" placeholder="Search bookings…" value="${esc(query)}" oninput="query=this.value;document.getElementById('rows').innerHTML=bookRows()"><button class="btn light" onclick="start('ride')">+ New request</button></div><section class="panel" id="rows">${bookRows()}</section>`}function bookRows(){let arr=db.bookings.filter(b=>JSON.stringify(b).toLowerCase().includes(query.toLowerCase()));return arr.length?arr.map(row).join(''):'<div class="empty">No matching bookings found.</div>'}function wallet(){let a=db.bookings.filter(b=>b.status!=='Cancelled'),fees=a.reduce((n,b)=>n+b.fee,0);return `<div class="eyebrow">Business overview</div><h1>Wallet & estimates</h1><p class="sub">A simple view of the service fees estimated in demo requests.</p><div class="notice">These are not actual earnings, a payment balance or withdrawable funds. Live payments need secure payment processing and reconciliation.</div><div class="stats"><div class="stat"><small>Requests</small><strong>${a.length}</strong></div><div class="stat"><small>Estimated fees</small><strong>${money(fees)}</strong></div><div class="stat"><small>Real balance</small><strong>${money(0)}</strong></div></div><section class="panel"><h2>Recent estimates</h2>${a.length?a.slice(0,8).map(b=>`<div class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(b.option)}<small class="muted" style="display:block">${esc(b.id)}</small></span><b>${money(b.fee)}</b></div>`).join(''):'<div class="empty">No requests yet.</div>'}</section>`}function account(){let p=db.profile;return `<div class="eyebrow">Your details</div><h1>Account & support</h1><p class="sub">Save your contact details for your own reference in this browser.</p><section class="panel"><h2>Contact profile</h2><form class="fields" style="margin-top:14px" onsubmit="profileSave(event)"><div class="field full"><label>Full name</label><input id="name" value="${esc(p.name)}" required></div><div class="field"><label>Phone</label><input id="phone" value="${esc(p.phone)}" placeholder="+234…" required></div><div class="field"><label>Email</label><input id="email" type="email" value="${esc(p.email)}"></div><div class="field full"><button class="btn">Save profile</button></div></form></section><section class="panel"><h2>Manual confirmation workflow</h2><p class="muted">For now, booking requests are stored in this browser. To receive requests from customers on different phones, we'll need a shared database and notifications (for example, email or WhatsApp) in the next stage.</p></section><section class="panel"><h2>Data tools</h2><button class="btn ghost" onclick="exportData()">Export local data</button> <button class="btn danger" onclick="clearData()">Clear local data</button><p style="margin-top:12px"><button class="btn ghost" onclick="adminLogin()">Admin view</button></p></section>`}function profileSave(e){e.preventDefault();db.profile={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim()};save();alert('Profile saved on this device.');render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='goldenglobalxprex-data.json';a.click();URL.revokeObjectURL(a.href)}function clearData(){if(confirm('Delete all locally saved bookings and profile details?')){db={bookings:[],profile:{name:'',phone:'',email:''}};save();render()}}function adminLogin(){let p=prompt('Demo admin passcode:');if(p==='GGX-DEMO-2026'){admin=true;page='admin';render()}else if(p!==null)alert('Incorrect demo passcode. This is not production security.')}function adminPage(){return `<div class="eyebrow">Operations</div><h1>Admin dashboard</h1><p class="sub">View booking requests saved in this browser only.</p><div class="notice">Production admin access must use secure server-side authentication and permissions. This demo is not secure.</div><div class="stats"><div class="stat"><small>Total requests</small><strong>${db.bookings.length}</strong></div><div class="stat"><small>Estimated booking value</small><strong>${money(db.bookings.reduce((a,b)=>a+b.total,0))}</strong></div><div class="stat"><small>Estimated fees</small><strong>${money(db.bookings.reduce((a,b)=>a+b.fee,0))}</strong></div></div><section class="panel"><div class="between"><h2>Booking requests</h2><button class="btn light" onclick="exportData()">Export JSON</button></div>${db.bookings.length?db.bookings.map(row).join(''):'<div class="empty">No booking requests yet.</div>'}</section><button class="btn ghost" onclick="admin=false;go('home')">Exit admin view</button>`}function render(){nav();let m=document.getElementById('main');m.innerHTML=page==='home'?home():page==='form'?form():page==='review'?reviewPage():page==='done'?done():page==='bookings'?bookings():page==='wallet'?wallet():page==='account'?account():page==='admin'?adminPage():home()}render();
</script></body></html>
